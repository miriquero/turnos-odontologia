<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnos — consultorio odontológico</title>
<style>
  :root{
    --fondo:#eef1f4; --panel:#fff; --borde:#d5dce4; --texto:#1b2430; --suave:#5f6d7e;
    --acento:#0d6b5f; --acento-suave:#e3f0ed; --ok:#0f7a48; --error:#b4232a; --aviso:#9a6700;
    --fila:22px; --reloj:#d64545;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --fondo:#0f141a; --panel:#19212a; --borde:#2b3745; --texto:#e6edf3; --suave:#95a3b2;
    --acento:#3fb9a4; --acento-suave:#17302d; --ok:#46c07e; --error:#f4777d; --aviso:#e0b341;
    --reloj:#ff6b6b;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--texto);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

  /* ---------- marco ---------- */
  header{background:var(--panel);border-bottom:1px solid var(--borde);padding:11px 20px 0;
    position:sticky;top:0;z-index:30}
  .tituloBarra{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:10px}
  header h1{font-size:16px;margin:0;letter-spacing:-.01em}
  .dia{color:var(--suave)} .dia::first-letter{text-transform:uppercase}
  .ficticio{font-size:11px;border:1px solid var(--borde);border-radius:99px;padding:2px 9px;color:var(--suave)}
  .reloj{margin-left:auto;color:var(--suave);font-variant-numeric:tabular-nums}
  nav{display:flex;gap:2px;overflow-x:auto}
  nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--suave);
    padding:9px 13px;font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap;font-weight:500}
  nav button.activa{color:var(--acento);border-bottom-color:var(--acento);font-weight:600}
  nav button:hover{color:var(--texto)}
  #banner{position:sticky;top:84px;z-index:25}
  #banner:not(:empty){padding:10px 20px 0}
  .banner{padding:10px 13px;border-radius:7px;border-left:3px solid;font-size:13.5px;
    box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .banner.ok{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
  .banner.mal{border-color:var(--error);color:var(--error);background:color-mix(in srgb,var(--error) 12%,var(--panel))}
  .banner .regla{float:right;font-size:10.5px;border:1px solid currentColor;border-radius:99px;padding:0 7px}
  .banner .acciones{margin-top:8px}
  main{padding:16px 20px 40px}
  .dos{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
  @media (max-width:980px){.dos{grid-template-columns:1fr}}

  /* ---------- cajas ---------- */
  .caja{background:var(--panel);border:1px solid var(--borde);border-radius:9px;margin-bottom:14px}
  .caja h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--suave);
    margin:0;padding:11px 14px;border-bottom:1px solid var(--borde);font-weight:600;
    display:flex;justify-content:space-between;gap:10px}
  .cuerpo{padding:12px 14px}
  .nota{font-size:11.5px;color:var(--suave);margin:11px 0 0;padding-top:9px;border-top:1px solid var(--borde)}
  .nota:first-child{margin-top:0;padding-top:0;border:0}

  /* ---------- grilla ---------- */
  .grilla{display:grid;overflow:auto;padding:0 10px 10px}
  .cabecera{display:grid;position:sticky;top:0;background:var(--panel);z-index:3}
  .cabecera div{padding:9px 6px;font-size:12px;font-weight:600;text-align:center;
    border-bottom:1px solid var(--borde)}
  .cuerpoGrilla{display:grid;position:relative}
  .horas div{height:var(--fila);font-size:10px;color:var(--suave);text-align:right;
    padding-right:8px;font-variant-numeric:tabular-nums}
  .horas div.enPunto{border-top:1px solid var(--borde)}
  .col{position:relative;border-left:1px solid var(--borde)}
  .ranura{height:var(--fila);cursor:pointer}
  .ranura.enPunto{border-top:1px solid var(--borde)}
  .ranura.pasado{background:repeating-linear-gradient(45deg,transparent,transparent 5px,
    rgba(127,127,127,.06) 5px,rgba(127,127,127,.06) 10px)}
  .ranura:hover{background:var(--acento-suave)}
  .ahora{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--reloj);z-index:2}
  .ahora::before{content:"";position:absolute;left:-4px;top:-4px;width:7px;height:7px;
    border-radius:50%;background:var(--reloj)}
  .turno{position:absolute;border-radius:5px;padding:3px 6px;overflow:hidden;cursor:pointer;
    font-size:11.5px;line-height:1.25;border-left:3px solid;z-index:1}
  .turno b{display:block;font-weight:600;font-size:12px}
  .turno small{opacity:.8;display:block}
  .turno.angosto{padding:2px 5px}
  .turno.angosto b,.turno.angosto small{font-size:10.5px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .turno.AGENDADO{background:var(--acento-suave);border-color:var(--acento);color:var(--texto)}
  .turno.ATENDIDO{background:rgba(15,122,72,.14);border-color:var(--ok)}
  .turno.CANCELADO{background:transparent;border:1px dashed var(--borde);
    border-left:3px dashed var(--error);color:var(--suave);text-decoration:line-through}
  .turno.AUSENTE{background:transparent;border:1px dashed var(--borde);
    border-left:3px dashed var(--aviso);color:var(--suave)}
  .chip{display:inline-block;font-size:9.5px;letter-spacing:.04em;border:1px solid currentColor;
    border-radius:99px;padding:0 5px;opacity:.85}

  /* ---------- formularios y tablas ---------- */
  label{display:block;font-size:11px;color:var(--suave);margin:9px 0 3px}
  select,input,textarea{width:100%;padding:7px 8px;font:inherit;font-size:13px;color:var(--texto);
    background:var(--fondo);border:1px solid var(--borde);border-radius:5px}
  textarea{resize:vertical;min-height:52px}
  .par{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  button.accion{font:inherit;font-size:13px;padding:7px 12px;border-radius:5px;cursor:pointer;
    border:1px solid var(--acento);background:var(--acento);color:#fff;font-weight:600}
  button.sec{background:transparent;color:var(--acento)}
  button.peligro{border-color:var(--error);color:var(--error);background:transparent}
  button.mini{font-size:12px;padding:5px 9px}
  .botones{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--suave);padding:0 10px 7px;font-weight:600}
  td{padding:7px 10px;border-top:1px solid var(--borde);vertical-align:top}
  td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .dato{display:flex;justify-content:space-between;gap:10px;padding:6px 0;
    border-bottom:1px solid var(--borde)}
  .dato span:first-child{color:var(--suave)}
  .lista{list-style:none;margin:0;padding:0;font-size:12.5px;max-height:230px;overflow:auto}
  .lista li{padding:6px 0;border-top:1px solid var(--borde);color:var(--suave)}
  .lista li:first-child{border-top:0}
  code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
  .vacio{color:var(--suave);font-style:italic;font-size:12.5px}
  .si{color:var(--ok)} .no{color:var(--error)}
  .veredicto{padding:16px;border-radius:8px;border-left:4px solid;margin-bottom:12px}
  .veredicto.libre{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
  .veredicto.ocupada{border-color:var(--error);background:color-mix(in srgb,var(--error) 10%,var(--panel))}
  .veredicto b{font-size:17px;display:block;margin-bottom:5px}
  .veredicto .regla{font-size:11px;border:1px solid currentColor;border-radius:99px;padding:1px 8px;
    display:inline-block;margin-top:7px}
  .cambio{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;
    padding:9px 0;border-top:1px solid var(--borde);font-size:12.5px}
  .cambio .flecha{color:var(--suave)}
  .cambio .viejo{color:var(--suave);text-decoration:line-through}
</style>
</head>
<body>

<header>
  <div class="tituloBarra">
    <h1>Turnos · consultorio odontológico</h1>
    <span class="dia" id="dia">—</span>
    <span class="ficticio">datos ficticios</span>
    <span class="reloj">ahora <b id="ahora">—</b></span>
    <button class="accion sec mini" id="reiniciar">Restablecer</button>
  </div>
  <nav id="nav"></nav>
</header>

<div id="banner"></div>
<main id="vista"></main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g,
  (c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);

let E = null;          // estado del servidor
let vista = "agenda";
let turnoAbierto = null;
let nuevo = null;      // ranura clickeada
let intento = null;    // ultima alta rechazada, para ofrecer sobreturno

const PANTALLAS = [
  ["agenda",        "Agenda"],
  ["turno",         "Turno"],
  ["disponibilidad","Disponibilidad"],
  ["auditoria",     "Auditoría"],
  ["recursos",      "Recursos"],
];

async function pedir(url, datos) {
  const opciones = datos ? {
    method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams(datos).toString()} : {};
  E = await (await fetch(url, opciones)).json();
  pintar();
}

function ir(v, id) { vista = v; if (id !== undefined) turnoAbierto = id; intento = null; pintar(); }
function opciones(items, sel, conDuracion) {
  return items.map(i => `<option value="${esc(i.id)}" ${i.id===sel?"selected":""}>
    ${esc(i.nombre + (conDuracion ? ` (${i.duracion} min)` : ""))}</option>`).join("");
}

/* ============================================================ AGENDA */
function vistaAgenda() {
  return `<div class="dos">
    <section class="caja"><h2>Agenda del día<span>${esc(E.turnos.length)} turnos</span></h2>
      <div class="grilla" id="grilla"></div></section>
    <aside><section class="caja"><h2 id="panelTitulo">Nuevo turno</h2>
      <div class="cuerpo" id="panelCuerpo"></div></section></aside>
  </div>`;
}

function pintarGrilla() {
  const cols = E.profesionales.length;
  const anchos = `58px repeat(${cols}, minmax(135px, 1fr))`;
  const cab = '<div></div>' + E.profesionales.map(p => `<div>${esc(p.nombre)}</div>`).join("");
  const horas = E.horarios.map(h =>
    `<div class="${h.enPunto?"enPunto":""}">${h.enPunto?esc(h.hora):""}</div>`).join("");

  const columnas = E.profesionales.map(p => {
    const ranuras = E.horarios.map(h =>
      `<div class="ranura ${h.enPunto?"enPunto":""} ${h.pasado?"pasado":""}"
            data-prof="${esc(p.id)}" data-iso="${esc(h.iso)}"></div>`).join("");

    const delDia = E.turnos.filter(t => t.profesionalId === p.id && t.fila >= 0 && t.fila < E.filas)
      .sort((a,b) => a.fila - b.fila || a.alto - b.alto);
    delDia.forEach(t => { t._alto = Math.max(1, Math.min(t.alto, E.filas - t.fila)); });
    // Carriles por GRUPO de superposición: un turno solo se angosta si de verdad comparte franja.
    let grupo = [], finGrupo = -1;
    const cerrar = () => {
      const n = grupo.length ? Math.max(...grupo.map(t => t._carril)) + 1 : 1;
      grupo.forEach(t => { t._carriles = n; }); grupo = [];
    };
    delDia.forEach(t => {
      if (t.fila >= finGrupo) { cerrar(); finGrupo = -1; }
      const ocupados = []; grupo.forEach(o => { ocupados[o._carril] = o.fila + o._alto; });
      let carril = 0;
      while (ocupados[carril] !== undefined && ocupados[carril] > t.fila) carril++;
      t._carril = carril; grupo.push(t);
      finGrupo = Math.max(finGrupo, t.fila + t._alto);
    });
    cerrar();

    const bloques = delDia.map(t => {
      const ancho = 100 / (t._carriles || 1);
      const angosto = (t._carriles || 1) > 1;
      const compacto = t._alto <= 1;
      const cuerpo = compacto
        ? `<b>${esc(t.inicio)} ${esc(t.paciente)}${t.esSobreturno?" ·S":""}</b>`
        : `<b>${esc(t.paciente)}</b>
           <small>${esc(t.inicio)}–${esc(t.fin)} · ${esc(t.prestacion)} · ${esc(t.sillon)}</small>
           ${t.esSobreturno?'<span class="chip">SOBRETURNO</span>':""}
           ${t.estado!=="AGENDADO" && t._alto>=3?`<span class="chip">${esc(t.estado)}</span>`:""}`;
      return `<div class="turno ${esc(t.estado)} ${angosto?"angosto":""}" data-turno="${esc(t.id)}"
          title="${esc(t.inicio)}–${esc(t.fin)} · ${esc(t.paciente)} · ${esc(t.prestacion)} · ${esc(t.estado)}"
          style="top:calc(${t.fila} * var(--fila)); height:calc(${t._alto} * var(--fila) - 2px);
                 left:calc(${t._carril*ancho}% + 3px); width:calc(${ancho}% - 6px)">${cuerpo}</div>`;
    }).join("");

    const linea = (E.ahoraFila >= 0 && E.ahoraFila < E.filas)
      ? `<div class="ahora" style="top:calc(${E.ahoraFila} * var(--fila))"></div>` : "";
    return `<div class="col">${ranuras}${bloques}${linea}</div>`;
  }).join("");

  $("grilla").innerHTML =
    `<div class="cabecera" style="grid-template-columns:${anchos}">${cab}</div>
     <div class="cuerpoGrilla" style="grid-template-columns:${anchos}">
       <div class="horas">${horas}</div>${columnas}</div>`;
}

function panelAlta() {
  const iso = nuevo?.inicioIso || E.horarios.find(h => !h.pasado)?.iso || E.horarios[0].iso;
  const hora = E.horarios.find(h => h.iso === iso)?.hora || "";
  $("panelTitulo").innerHTML = `Nuevo turno<span>${esc(hora)}</span>`;
  $("panelCuerpo").innerHTML = `
    <label for="pacienteId">Paciente</label>
    <select id="pacienteId">${opciones(E.pacientes)}</select>
    <div class="par">
      <div><label for="profesionalId">Profesional</label>
        <select id="profesionalId">${opciones(E.profesionales, nuevo?.profesionalId)}</select></div>
      <div><label for="sillonId">Sillón</label>
        <select id="sillonId">${opciones(E.sillones)}</select></div>
    </div>
    <label for="prestacionId">Prestación</label>
    <select id="prestacionId">${opciones(E.prestaciones, null, true)}</select>
    <input type="hidden" id="inicio" value="${esc(iso)}">
    <div class="botones"><button class="accion" id="btnAgendar">Agendar</button></div>
    <p class="nota">El horario de fin no se elige: sale de la duración de la prestación.</p>`;
  $("btnAgendar").onclick = () => {
    intento = {pacienteId:$("pacienteId").value, profesionalId:$("profesionalId").value,
      sillonId:$("sillonId").value, prestacionId:$("prestacionId").value, inicio:$("inicio").value};
    pedir("/api/agendar", intento);
  };
}

function panelSobreturno() {
  $("panelTitulo").textContent = "Autorizar sobreturno";
  $("panelCuerpo").innerHTML = `
    <p class="nota">El sobreturno es la única excepción a la regla de no superposición. Exige
      autorización del odontólogo dueño y un motivo.</p>
    <label for="autorizadoPor">Autoriza</label>
    <select id="autorizadoPor">${opciones(E.profesionales)}</select>
    <label for="motivoSt">Motivo</label>
    <textarea id="motivoSt" placeholder="Urgencia por dolor agudo"></textarea>
    <div class="botones"><button class="accion" id="btnSt">Autorizar y agendar</button>
      <button class="accion sec" id="btnStNo">Volver</button></div>`;
  $("btnStNo").onclick = () => { intento = null; pintar(); };
  $("btnSt").onclick = () => {
    const prof = E.profesionales.find(p => p.id === $("autorizadoPor").value);
    pedir("/api/sobreturno", {...intento, autorizadoPor:prof.nombre, motivo:$("motivoSt").value});
  };
}

/* ============================================================ TURNO */
function vistaTurno() {
  const t = E.turnos.find(x => x.id === turnoAbierto);
  if (!t) {
    return `<section class="caja"><h2>Turno</h2><div class="cuerpo">
      <p class="vacio">Elegí un turno en la agenda para ver su detalle.</p>
      <div class="botones"><button class="accion sec" onclick="ir('agenda')">Ir a la agenda</button></div>
    </div></section>`;
  }
  const historia = t.eventos.length
    ? t.eventos.map(e => `<li><code>${esc(e.accion)}</code> · ${esc(e.momento)} · ${esc(e.usuario)}</li>`).join("")
    : '<li class="vacio">Sin eventos: este turno viene del estado inicial.</li>';

  const cambios = t.detalles.length
    ? t.detalles.map(d => `
        <div class="cambio"><span class="viejo">${esc(d.anterior.franja)}</span>
          <span class="flecha">→</span><span>${esc(d.nuevo.franja)}</span></div>
        <div class="cambio"><span class="viejo">${esc(d.anterior.profesional)} · ${esc(d.anterior.sillon)}</span>
          <span class="flecha">→</span><span>${esc(d.nuevo.profesional)} · ${esc(d.nuevo.sillon)}</span></div>
        <p class="nota">${esc(d.momento)} · ${esc(d.usuario)}</p>`).join("")
    : '<p class="vacio">Este turno no se reprogramó.</p>';

  return `<div class="dos">
    <div>
      <section class="caja"><h2>${esc(t.paciente)}<span>${esc(t.estado)}</span></h2><div class="cuerpo">
        <div class="dato"><span>Franja</span><span>${esc(t.inicio)} – ${esc(t.fin)} · ${esc(t.duracion)} min</span></div>
        <div class="dato"><span>Profesional</span><span>${esc(t.profesional)}</span></div>
        <div class="dato"><span>Sillón</span><span>${esc(t.sillon)}</span></div>
        <div class="dato"><span>Prestación</span><span>${esc(t.prestacion)}</span></div>
        <div class="dato"><span>Ocupa la agenda</span>
          <span class="${t.ocupa?"si":"no"}">${t.ocupa?"sí":"no"}</span></div>
        ${t.esSobreturno?`<div class="dato"><span>Sobreturno</span>
          <span>autorizó ${esc(t.autorizadoPor)} a las ${esc(t.autorizadoEn)}</span></div>
          <div class="dato"><span>Motivo</span><span>${esc(t.motivoSobreturno)}</span></div>`:""}
        ${t.motivoCancelacion?`<div class="dato"><span>Motivo de cancelación</span>
          <span>${esc(t.motivoCancelacion)}</span></div>`:""}
        ${t.motivoAusencia?`<div class="dato"><span>Motivo de ausencia</span>
          <span>${esc(t.motivoAusencia)}</span></div>`:""}
      </div></section>

      <section class="caja"><h2>Historial de cambios<span>RN-AU-03</span></h2>
        <div class="cuerpo">${cambios}
        <p class="nota">El evento de auditoría dice <b>qué</b> pasó; este registro dice <b>qué
          valores</b> cambiaron. Son dos fuentes distintas porque <code>EventoAuditoria</code>
          quedó congelado con cuatro campos.</p></div></section>
    </div>

    <aside>
      <section class="caja"><h2>Acciones</h2><div class="cuerpo" id="acciones"></div></section>
      <section class="caja"><h2>Auditoría del turno</h2>
        <div class="cuerpo"><ul class="lista">${historia}</ul></div></section>
    </aside>
  </div>`;
}

function accionesTurno() {
  const t = E.turnos.find(x => x.id === turnoAbierto);
  if (!t || !$("acciones")) return;
  if (!t.abierto) {
    $("acciones").innerHTML = `<p class="nota">Este turno está cerrado. Los estados
      ATENDIDO, CANCELADO y AUSENTE son terminales y no admiten más cambios.</p>
      <div class="botones"><button class="accion sec" onclick="ir('agenda')">Volver a la agenda</button></div>`;
    return;
  }
  $("acciones").innerHTML = `
    <label for="nuevaHora">Reprogramar a</label>
    <div class="par">
      <select id="nuevaHora">${E.horarios.map(h =>
        `<option value="${esc(h.iso)}" ${h.iso===t.inicioIso?"selected":""}>${esc(h.hora)}</option>`).join("")}</select>
      <select id="nuevoSillon">${opciones(E.sillones, t.sillonId)}</select>
    </div>
    <div class="botones"><button class="accion mini" id="btnRepro">Reprogramar</button></div>
    <label for="motivo">Motivo</label>
    <textarea id="motivo" placeholder="Por qué se cancela, o por qué no vino"></textarea>
    <div class="botones">
      <button class="accion sec mini" id="btnAtendido">Atendido</button>
      <button class="accion sec mini" id="btnAusente">No vino</button>
      <button class="accion peligro mini" id="btnCancelar">Cancelar turno</button>
    </div>
    <p class="nota">Cancelar exige motivo y al menos ${esc(E.horasParaCancelar)} h de anticipación.
      La ausencia solo se registra una vez que llegó la hora del turno.</p>
    <div class="botones"><button class="accion sec mini" onclick="ir('agenda')">Volver</button></div>`;
  $("btnRepro").onclick = () => pedir("/api/reprogramar",
    {turnoId:t.id, inicio:$("nuevaHora").value, sillonId:$("nuevoSillon").value});
  $("btnCancelar").onclick = () => pedir("/api/cancelar", {turnoId:t.id, motivo:$("motivo").value});
  $("btnAtendido").onclick = () => pedir("/api/atendido", {turnoId:t.id});
  $("btnAusente").onclick  = () => pedir("/api/ausente",  {turnoId:t.id, motivo:$("motivo").value});
}

/* ============================================================ DISPONIBILIDAD */
function vistaDisponibilidad() {
  const c = E.consulta;
  const resultado = c ? `
    <div class="veredicto ${c.disponible?"libre":"ocupada"}">
      <b>${c.disponible?"Franja libre":"Franja ocupada"}</b>
      ${esc(c.profesional)} · ${esc(c.sillon)} · ${esc(c.inicio)}–${esc(c.fin)} (${esc(c.duracion)} min)
      <div>${esc(c.explicacion)}</div>
      ${c.codigoRegla?`<span class="regla">${esc(c.codigoRegla)}</span>`:""}
    </div>` : '<p class="vacio">Elegí una franja y consultá.</p>';

  return `<div class="dos">
    <section class="caja"><h2>Resultado</h2><div class="cuerpo">${resultado}
      <p class="nota">Esto es <code>ServicioDisponibilidad.evaluar</code> en crudo: el mismo motor
        que usa el alta, sin crear nada. Los intervalos son semiabiertos <code>[inicio, fin)</code>,
        así que una franja que empieza justo cuando termina otro turno <b>está libre</b>
        (<code>RN-AG-04</code>). Un turno CANCELADO o AUSENTE no ocupa (<code>RN-AG-07</code>).</p>
    </div></section>
    <aside><section class="caja"><h2>Consultar</h2><div class="cuerpo">
      <div class="par">
        <div><label for="dProf">Profesional</label>
          <select id="dProf">${opciones(E.profesionales)}</select></div>
        <div><label for="dSillon">Sillón</label>
          <select id="dSillon">${opciones(E.sillones)}</select></div>
      </div>
      <label for="dPrestacion">Prestación</label>
      <select id="dPrestacion">${opciones(E.prestaciones, null, true)}</select>
      <label for="dHora">Desde</label>
      <select id="dHora">${E.horarios.map(h =>
        `<option value="${esc(h.iso)}">${esc(h.hora)}</option>`).join("")}</select>
      <div class="botones"><button class="accion" id="btnConsultar">Consultar</button></div>
    </div></section></aside>
  </div>`;
}

/* ============================================================ AUDITORIA */
function vistaAuditoria() {
  const filas = [...E.auditoria].reverse();
  const tabla = filas.length ? filas.map(e => {
    const t = E.turnos.find(x => x.id === e.turnoId);
    return `<tr><td class="num">${esc(e.momento)}</td><td><code>${esc(e.accion)}</code></td>
      <td>${t?esc(t.paciente):esc(e.turnoId)}</td><td>${esc(e.usuario)}</td>
      <td class="num">${t?`<button class="accion sec mini" onclick="ir('turno','${esc(t.id)}')">ver</button>`:""}</td></tr>`;
  }).join("") : '<tr><td colspan="5" class="vacio">Todavía no se registró ningún evento.</td></tr>';

  const repro = E.turnos.flatMap(t => t.detalles.map(d => ({t, d})));
  const cambios = repro.length ? repro.map(({t,d}) => `
    <div class="cambio"><span>${esc(t.paciente)}</span><span class="flecha">·</span>
      <span><span class="viejo">${esc(d.anterior.franja)}</span> → ${esc(d.nuevo.franja)}</span></div>`).join("")
    : '<p class="vacio">Ninguna reprogramación todavía.</p>';

  return `<div class="dos">
    <section class="caja"><h2>Eventos<span>append only · ${esc(E.auditoria.length)}</span></h2>
      <div class="cuerpo"><table>
        <thead><tr><th>Hora</th><th>Acción</th><th>Paciente</th><th>Usuario</th><th></th></tr></thead>
        <tbody>${tabla}</tbody></table>
        <p class="nota">El registro es <b>append only</b> (<code>RN-AU-02</code>): se agrega y se
          lee, nunca se modifica ni se borra. Una operación rechazada no deja evento.</p>
      </div></section>
    <aside>
      <section class="caja"><h2>Detalle de reprogramaciones</h2>
        <div class="cuerpo">${cambios}</div></section>
      <section class="caja"><h2>Avisos al paciente — simulados</h2><div class="cuerpo">
        <ul class="lista">${E.avisos.length?E.avisos.map(a=>`<li>${esc(a)}</li>`).join("")
          :'<li class="vacio">Sin avisos todavía.</li>'}</ul>
        <p class="nota">El canal es simulado y no sale a la red. Un fallo del aviso nunca invalida
          la operación de agenda (<code>RN-NO-03</code>).</p></div></section>
    </aside>
  </div>`;
}

/* ============================================================ RECURSOS */
function tablaRecurso(titulo, items, extra) {
  return `<section class="caja"><h2>${esc(titulo)}<span>${items.length}</span></h2><div class="cuerpo">
    <table><thead><tr><th>Nombre</th>${extra?`<th>${esc(extra.titulo)}</th>`:""}<th>Estado</th></tr></thead>
    <tbody>${items.map(i => `<tr><td>${esc(i.nombre)}</td>
      ${extra?`<td class="num">${esc(extra.valor(i))}</td>`:""}
      <td class="${i.activo?"si":"no"}">${i.activo?"activo":"inactivo"}</td></tr>`).join("")}
    </tbody></table></div></section>`;
}

function vistaRecursos() {
  return `<div class="dos"><div>
      ${tablaRecurso("Profesionales", E.profesionales)}
      ${tablaRecurso("Sillones", E.sillones)}
      ${tablaRecurso("Prestaciones", E.prestaciones, {titulo:"Duración", valor:(p)=>p.duracion+" min"})}
    </div><aside>
      ${tablaRecurso("Pacientes", E.pacientes, {titulo:"Documento", valor:(p)=>p.documento})}
      <section class="caja"><h2>Por qué es solo lectura</h2><div class="cuerpo">
        <p class="nota">Administrar el catálogo —dar de alta profesionales, sillones, prestaciones
          y pacientes— es el change <code>C-06</code>, que todavía no está especificado ni
          implementado. Construir ese ABM acá sería inventar alcance, y la tercera regla dura del
          proyecto lo prohíbe: lo que no está en el spec aprobado, no se implementa.</p>
        <p class="nota">Estos datos sí se usan: <code>RN-AG-08</code> exige que el profesional, el
          sillón y la prestación estén <b>activos</b> para poder agendar.</p>
      </div></section>
    </aside></div>`;
}

/* ============================================================ pintado */
function pintar() {
  $("dia").textContent = E.fecha;
  $("ahora").textContent = E.ahora;
  $("nav").innerHTML = PANTALLAS.map(([id,txt]) =>
    `<button class="${vista===id?"activa":""}" data-vista="${id}">${esc(txt)}</button>`).join("");

  const solape = E.codigoRechazo === "RN-AG-02" || E.codigoRechazo === "RN-AG-03";
  $("banner").innerHTML = (E.codigoRechazo || E.mensajeRechazo)
    ? `<div class="banner mal">${E.codigoRechazo?`<span class="regla">${esc(E.codigoRechazo)}</span>`:""}
        ${esc(E.mensajeRechazo)}
        ${solape && intento && vista==="agenda"?`<div class="acciones">
          <button class="accion mini" id="btnOfrecerSt">Autorizar sobreturno</button></div>`:""}</div>`
    : E.aviso ? `<div class="banner ok">${esc(E.aviso)}</div>` : "";

  $("vista").innerHTML =
      vista === "agenda"         ? vistaAgenda()
    : vista === "turno"          ? vistaTurno()
    : vista === "disponibilidad" ? vistaDisponibilidad()
    : vista === "auditoria"      ? vistaAuditoria()
    :                              vistaRecursos();

  if (vista === "agenda") { pintarGrilla(); if (intento && !E.aviso) panelSobreturno(); else panelAlta(); }
  if (vista === "turno") accionesTurno();
  if (vista === "disponibilidad" && $("btnConsultar")) {
    $("btnConsultar").onclick = () => pedir("/api/disponibilidad", {
      profesionalId:$("dProf").value, sillonId:$("dSillon").value,
      prestacionId:$("dPrestacion").value, inicio:$("dHora").value});
  }
  if ($("btnOfrecerSt")) $("btnOfrecerSt").onclick = () => panelSobreturno();
}

document.addEventListener("click", (ev) => {
  const tab = ev.target.closest("nav button");
  if (tab) { ir(tab.dataset.vista); return; }
  const bloque = ev.target.closest(".turno");
  if (bloque) { ir("turno", bloque.dataset.turno); return; }
  const ranura = ev.target.closest(".ranura");
  if (ranura) {
    intento = null;
    nuevo = {profesionalId:ranura.dataset.prof, inicioIso:ranura.dataset.iso};
    pintar();
  }
});
$("reiniciar").onclick = () => { turnoAbierto = null; intento = null; nuevo = null; pedir("/api/reiniciar", {}); };

pedir("/api/estado");
</script>
</body>
</html>
