plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'ar.edu.turnos'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // El dominio no usa Spring; el starter de test solo trae JUnit 5, AssertJ y Mockito.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// El MVP no tiene aplicacion ejecutable (sin REST ni persistencia): solo el jar plano.
// La demo NO usa Spring, asi que bootJar sigue desactivado.
bootJar { enabled = false }
jar { enabled = true }

// Demo visual, FUERA del alcance del MVP: levanta el nucleo detras de una pagina web servida
// por el servidor HTTP del propio JDK. Sin dependencias nuevas y sin Spring.
tasks.register('demo', JavaExec) {
    group = 'application'
    description = 'Levanta la demo web en http://localhost:8080 (cambiar el puerto: --args="9090")'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ar.edu.turnos.infraestructura.demo.DemoApp'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
    }
}
